<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ef" />
    <title>Reflexion — Care. Connected.</title>
    <style>
      :root { --ivory:#fbf7ef; --card:#fffdfa; --navy:#172c46; --teal:#006d69; --teal-dark:#005955; --sage:#dbe7d8; --sage-text:#335e48; --line:#e6ddd0; --muted:#66717b; --amber:#9c6b22; --red:#a64d47; --shadow:0 10px 32px rgba(33,43,53,.08); --serif: Georgia, 'Times New Roman', serif; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:linear-gradient(135deg,#f4eee3,#fbfaf6); color:var(--navy); font-family:var(--sans); } button,input,textarea { font:inherit; } button { cursor:pointer; } .device { background:var(--ivory); margin:0 auto; min-height:100vh; max-width:480px; position:relative; overflow:hidden; padding:env(safe-area-inset-top) 20px calc(94px + env(safe-area-inset-bottom)); }
      .leaf { color:#6e9668; font-size:30px; line-height:1; } .brand { align-items:center; display:flex; gap:8px; } .brand strong { display:block; font-family:var(--serif); font-size:24px; font-weight:500; letter-spacing:-.5px; } .brand small { color:var(--teal); display:block; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
      .top { align-items:center; display:flex; justify-content:space-between; min-height:58px; } .icon-button { align-items:center; background:transparent; border:0; border-radius:999px; color:var(--navy); display:inline-flex; height:44px; justify-content:center; width:44px; } .icon-button:focus-visible,.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid #78aaa5; outline-offset:2px; }
      .screen { animation:appear .22s ease-out; } @keyframes appear { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:translateY(0) } } h1 { font-family:var(--serif); font-size:38px; font-weight:500; letter-spacing:-1.1px; line-height:1.04; margin:28px 0 10px; } h2 { font-family:var(--serif); font-size:28px; font-weight:500; line-height:1.12; margin:16px 0 10px; } p { color:var(--muted); font-size:16px; line-height:1.48; margin:0; } .eyebrow { color:var(--teal); font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin-top:18px; padding:18px; } .row { align-items:center; display:flex; gap:12px; } .row-between { align-items:center; display:flex; justify-content:space-between; gap:12px; } .avatar { align-items:center; background:#eadfce; border-radius:50%; color:var(--navy); display:flex; font-family:var(--serif); font-size:24px; height:58px; justify-content:center; width:58px; } .name { font-family:var(--serif); font-size:23px; } .chevron { color:var(--muted); font-size:25px; }
      .pill { background:#edf4ea; border-radius:999px; color:var(--sage-text); display:inline-block; font-size:12px; font-weight:700; margin-top:4px; padding:5px 9px; } .pill.neutral { background:#f1efeb; color:#6e6b67; } .facts { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; } .facts p { font-size:14px; } .primary { background:var(--teal); border:0; border-radius:12px; color:white; font-weight:750; min-height:52px; padding:0 18px; width:100%; } .primary:hover { background:var(--teal-dark); } .secondary { background:transparent; border:1px solid var(--teal); border-radius:12px; color:var(--teal); font-weight:750; min-height:48px; padding:0 16px; width:100%; } .text-button { background:transparent; border:0; color:var(--teal); font-weight:750; min-height:44px; padding:0; }
      .banner { background:#f1f4e9; border:1px solid #dbe5d4; border-radius:16px; margin-top:18px; padding:14px; } .banner strong { font-size:15px; } .banner p { font-size:13px; margin-top:3px; } .inline-action { color:var(--teal); font-size:13px; font-weight:750; margin-top:8px; padding:0; }
      .nav { background:rgba(255,253,250,.96); border-top:1px solid var(--line); bottom:0; display:flex; height:80px; left:0; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); position:absolute; right:0; } .tab { background:transparent; border:0; color:#67717a; flex:1; font-size:11px; font-weight:650; min-height:52px; } .tab span { display:block; font-size:21px; line-height:22px; } .tab.active { color:var(--teal); }
      .list { display:grid; gap:10px; margin-top:20px; } .list-button { align-items:center; background:var(--card); border:1px solid var(--line); border-radius:15px; color:var(--navy); display:flex; gap:12px; min-height:66px; padding:12px; text-align:left; width:100%; } .list-button .round { align-items:center; background:#eef3ea; border-radius:50%; color:var(--sage-text); display:flex; font-size:20px; height:38px; justify-content:center; width:38px; } .list-button strong { display:block; font-size:15px; } .list-button small { color:var(--muted); display:block; font-size:12px; margin-top:2px; }
      .empty { align-items:center; background:var(--card); border:1px solid var(--line); border-radius:20px; display:flex; flex-direction:column; gap:12px; margin-top:28px; padding:28px 20px; text-align:center; } .empty .mark { align-items:center; background:#eef3ea; border-radius:50%; display:flex; font-size:28px; height:62px; justify-content:center; width:62px; }
      label { color:var(--navy); display:block; font-size:14px; font-weight:750; margin:20px 0 7px; } input,textarea { background:#fffdf9; border:1px solid #d9d1c5; border-radius:11px; color:var(--navy); font-size:16px; min-height:52px; padding:13px; width:100%; } textarea { min-height:130px; resize:vertical; } .hint { font-size:13px; margin-top:7px; } .switch-row { align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; display:flex; justify-content:space-between; margin-top:18px; padding:15px; } .switch { background:#ccd1d0; border:0; border-radius:999px; height:31px; padding:3px; width:54px; } .switch i { background:white; border-radius:50%; display:block; height:25px; transform:translateX(0); transition:.18s; width:25px; } .switch.on { background:var(--teal); } .switch.on i { transform:translateX(23px); }
      .message { background:#e7f3f0; border-radius:16px 16px 4px 16px; margin:18px 0 0 auto; max-width:88%; padding:13px; } .message p { color:var(--navy); } .message small { color:var(--sage-text); display:block; font-size:12px; font-weight:700; margin-top:7px; } .activity { border-left:2px solid #d4e4de; margin:18px 0; padding-left:18px; } .activity-item { margin:0 0 18px; position:relative; } .activity-item:before { background:var(--teal); border:3px solid var(--ivory); border-radius:50%; content:''; height:12px; left:-25px; position:absolute; top:3px; width:12px; } .activity-item strong { display:block; font-size:15px; } .activity-item small { color:var(--muted); display:block; margin-top:3px; }
      .login { padding-top:9vh; text-align:center; } .login .brand { justify-content:center; margin-bottom:35px; } .login h1 { font-size:36px; } .login form { text-align:left; } .login .primary { margin-top:25px; } .demo-note { background:#f4eee1; border-radius:13px; color:#655f57; font-size:13px; margin-top:20px; padding:12px; text-align:left; }
      @media (min-width: 600px) { body { padding:30px; } .device { border:1px solid #e7dfd4; border-radius:36px; box-shadow:0 24px 80px rgba(28,42,51,.16); min-height:860px; } }
    </style>
  </head>
  <body>
    <main class="device" id="app" aria-live="polite">
      <section class="login"><div class="brand"><span class="leaf">⌁</span><div><strong>Reflexion</strong><small>care · connected</small></div></div><h1>Loading Reflexion…</h1></section>
    </main>
    <script>
      let state;
      try {
        state = JSON.parse(localStorage.getItem('reflexion-web-demo') || '{"signedIn":false,"paired":false,"notifications":true,"message":""}');
      } catch {
        // A stale or partially written preview value must never leave the whole page blank.
        state = { signedIn:false, paired:false, notifications:true, message:'' };
      }
      const save = () => localStorage.setItem('reflexion-web-demo', JSON.stringify(state));
      const app = document.querySelector('#app');
      const tabs = (active) => `<nav class="nav" aria-label="Main navigation">${[['home','⌂','Home'],['activity','◷','Activity'],['chat','◌','Chat'],['settings','⚙','Settings']].map(([id,icon,label]) => `<button class="tab ${active===id?'active':''}" data-go="${id}" aria-label="${label}"><span>${icon}</span>${label}</button>`).join('')}</nav>`;
      const appHeader = (back) => `<header class="top">${back?'<button class="icon-button" data-go="home" aria-label="Back">‹</button>':'<div></div>'}<div class="brand"><span class="leaf">⌁</span><div><strong>Reflexion</strong><small>care · connected</small></div></div><button class="icon-button" data-go="settings" aria-label="Settings">⚙</button></header>`;
      function home(){ return `${appHeader(false)}<section class="screen"><h1>Good morning, Chloe</h1><p>Here are your family’s connected updates.</p>${!state.paired?`<div class="banner"><strong>Pair Mum’s Mirror to begin</strong><p>There are no interaction updates until a real device is paired and sends them.</p><button class="text-button inline-action" data-go="pair">Pair device</button></div>`:''}<button class="card" data-go="loved" style="text-align:left;width:100%"><div class="row"><div class="avatar">M</div><div style="flex:1"><div class="name">Mum</div><span class="pill ${state.paired?'neutral':''}">${state.paired?'Waiting for the first interaction':'No device paired'}</span></div><span class="chevron">›</span></div><div class="facts"><p>${state.paired?'The Mirror is paired. Factual updates will appear after a real interaction is recorded.':'Pair a Reflexion Mirror before interaction updates can be shown.'}</p></div><div style="margin-top:16px"><span class="primary" style="display:block;text-align:center;line-height:52px">${state.paired?'Leave a message':'Pair device'}</span></div></button></section>${tabs('home')}`; }
      function activity(){ const item=state.message?`<div class="activity-item"><strong>Family message</strong><small>Your message to Mum is queued for the paired Mirror.</small></div>`:''; return `${appHeader(false)}<section class="screen"><div class="row-between"><h1 style="margin-top:28px">Activity</h1><button class="text-button" data-go="activity">Refresh</button></div><p>A factual timeline of device connections and family-message delivery.</p>${state.paired||state.message?`<div class="activity">${state.paired?'<div class="activity-item"><strong>Device paired</strong><small>Reflexion Mirror is connected for Mum.</small></div>':''}${item}</div>`:`<div class="empty"><div class="mark">⌁</div><h2>No activity to show yet</h2><p>Pair a device or send a family message to create the first factual activity entry.</p><button class="primary" data-go="pair">Pair device</button></div>`}</section>${tabs('activity')}`; }
      function chat(){ return `${appHeader(false)}<section class="screen"><h1>Chat</h1><p>Messages arrive as a notification on the paired Mirror. They stay private until Mum chooses to open them.</p><button class="list-button" data-go="thread"><div class="avatar" style="height:46px;width:46px;font-size:20px">M</div><div style="flex:1"><strong>Mum</strong><small>${state.message?state.message:'No family messages yet.'}</small><small style="color:var(--sage-text);font-weight:700">${state.message?'Queued for the Mirror':state.paired?'Ready to send':'No device paired'}</small></div><span class="chevron">›</span></button></section>${tabs('chat')}`; }
      function thread(){ return `${appHeader(true)}<section class="screen"><h2>Messages for Mum</h2><p>The paired Mirror shows a notification first. Opening it is the only action that marks a message opened.</p>${state.message?`<div class="message"><p>${escapeHtml(state.message)}</p><small>Queued for the Mirror</small></div>`:'<div class="empty"><div class="mark">✉</div><p>No messages have been sent yet.</p></div>'}<button class="primary" style="margin-top:25px" data-go="compose">Send a message</button></section>${tabs('chat')}`; }
      function compose(){ return `${appHeader(true)}<section class="screen"><h2>Send a message</h2><p>A notification appears on the paired Mirror. The message remains private until it is opened.</p><label for="message">Message</label><textarea id="message" placeholder="Write something warm and familiar">${escapeHtml(state.draft||'')}</textarea><label for="when">When should it arrive?</label><select id="when" style="background:#fffdf9;border:1px solid #d9d1c5;border-radius:11px;min-height:52px;padding:13px;width:100%"><option>Send now</option><option>Choose date and time</option></select><p class="hint">This web version stores a local preview. The installed app sends through the authenticated Reflexion backend.</p><button class="primary" style="margin-top:25px" data-action="preview">Preview message</button></section>${tabs('chat')}`; }
      function preview(){ const draft=(document.querySelector('#message')||{}).value || state.draft || ''; state.draft=draft; save(); return `${appHeader(true)}<section class="screen"><h2>Review message</h2><div class="card"><span class="eyebrow">To</span><p style="color:var(--navy);margin:4px 0 18px">Mum</p><span class="eyebrow">Delivery</span><p style="color:var(--navy);margin:4px 0 18px">Send now</p><span class="eyebrow">Message</span><p style="color:var(--navy);margin-top:5px">${escapeHtml(draft)}</p></div><button class="primary" style="margin-top:20px" data-action="send">Queue message</button><button class="secondary" style="margin-top:10px" data-go="compose">Keep editing</button></section>${tabs('chat')}`; }
      function pair(){ return `${appHeader(true)}<section class="screen"><h2>Pair Mum’s Mirror</h2><p>Enter the six-digit code currently shown on the device. The live caregiver app claims this code through the secure pairing service.</p><label for="code">Six-digit pairing code</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000" /><div class="card"><div class="row"><span class="leaf">⌁</span><div><strong>What happens next</strong><p style="font-size:13px">The Mirror receives a credential, connects to Mum’s profile, and can then receive family-message notifications.</p></div></div></div><button class="primary" style="margin-top:20px" data-action="pair">Continue</button><button class="text-button" style="display:block;margin:12px auto" data-go="home">Set up later</button></section>${tabs('home')}`; }
      function loved(){ return `${appHeader(true)}<section class="screen"><span class="eyebrow">Today</span><h1 style="margin-top:8px">Mum</h1><div class="card"><span class="eyebrow">Observed</span><p style="margin-top:5px">${state.paired?'No interaction data has been received from the paired device yet.':'No device is paired yet.'}</p><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><span class="eyebrow">What this means</span><p style="margin-top:5px">Reflexion shows only data received from the paired device. It does not infer mood, wellbeing or whether activities happened.</p><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><span class="eyebrow">Next action</span><p style="margin-top:5px">${state.paired?'Leave a familiar message or review the device connection.':'Pair the Mirror to start receiving factual updates.'}</p></div><button class="primary" style="margin-top:20px" data-go="${state.paired?'compose':'pair'}">${state.paired?'Leave a message':'Pair device'}</button></section>${tabs('home')}`; }
      function settings(){ return `${appHeader(false)}<section class="screen"><h1>Settings</h1><p>Manage your account, household and care preferences.</p><div class="switch-row"><div><strong>App notifications</strong><p style="font-size:13px">Conversation summaries, interaction updates, device & routine updates, family messages & weekly summaries.</p></div><button class="switch ${state.notifications?'on':''}" data-action="notifications" aria-label="Toggle notifications"><i></i></button></div><div class="list"><button class="list-button" data-go="pair"><span class="round">⌁</span><div><strong>Connected devices</strong><small>${state.paired?'Reflexion Mirror paired':'No device paired'}</small></div><span class="chevron">›</span></button><button class="list-button" data-go="home"><span class="round">◷</span><div><strong>Routine management</strong><small>Do not notify · notify after one missed/unclear response · include in daily summary</small></div><span class="chevron">›</span></button><button class="list-button" data-go="home"><span class="round">♧</span><div><strong>Consent & control</strong><small>Scoped data, sharing choices and pause controls</small></div><span class="chevron">›</span></button></div></section>${tabs('settings')}`; }
      const escapeHtml=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      function login(){ return `<section class="login screen"><div class="brand"><span class="leaf">⌁</span><div><strong>Reflexion</strong><small>care · connected</small></div></div><h1>Welcome back</h1><p>Sign in to continue caring with confidence.</p><form id="login-form"><label>Email</label><input type="email" placeholder="you@email.com" required><label>Password</label><input type="password" placeholder="Enter your password" required><button class="primary" type="submit">Sign in</button></form><div class="demo-note">This iPhone-friendly HTML is a local preview. Sign in opens the connected-flow layout without storing credentials.</div></section>`; }
      function render(route='home'){ if(!state.signedIn){ app.innerHTML=login(); document.querySelector('#login-form').onsubmit=e=>{e.preventDefault();state.signedIn=true;save();render('home')};return; } app.innerHTML=({home,activity,chat,thread,compose,pair,loved,settings,preview})[route](); app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>render(el.dataset.go)); app.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{ const a=el.dataset.action; if(a==='notifications'){state.notifications=!state.notifications;save();render('settings')} if(a==='pair'){const code=document.querySelector('#code').value;if(!/^\d{6}$/.test(code)){alert('Enter the six-digit code shown on the Mirror.');return}state.paired=true;save();render('home')} if(a==='preview'){const draft=document.querySelector('#message').value;if(!draft.trim()){alert('Write a message first.');return}state.draft=draft;save();render('preview')} if(a==='send'){state.message=state.draft;state.draft='';save();render('thread')} }); }
      try { render(); }
      catch (error) {
        console.error(error);
        app.innerHTML = `<section class="login"><div class="brand"><span class="leaf">⌁</span><div><strong>Reflexion</strong><small>care · connected</small></div></div><h1>Let’s start again</h1><p>The local preview data was reset so this screen can open safely.</p><button class="primary" style="margin-top:25px" id="reset-preview">Open Reflexion</button></section>`;
        document.querySelector('#reset-preview').onclick = () => { localStorage.removeItem('reflexion-web-demo'); location.reload(); };
      }
    </script>
  </body>
</html>
